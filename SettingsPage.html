    <script>
        var app = document.getElementsByTagName("BODY")[0];
        if (localStorage.lightMode == "light") {
            app.setAttribute("light-mode", "light");
        }
        function toggle_light_mode() {
            var app = document.getElementsByTagName("BODY")[0];
            if (localStorage.lightMode == "light") {
            localStorage.lightMode = "dark";
            app.setAttribute("light-mode", "dark");
            } else {
            localStorage.lightMode = "light";
            app.setAttribute("light-mode", "light");
            }		
        }

        
        document.addEventListener("DOMContentLoaded", function () {
        const app = document.body;
        
        // Check localStorage and apply the saved mode
        if (localStorage.getItem("dyslexiaMode") === "on") {
            app.setAttribute("dyslexia-mode", "on");
        }
        });

        function toggleDyslexiaFont() {
        // Check current dyslexia mode in localStorage
        let currentMode = localStorage.getItem("dyslexiaMode");

        // Toggle the value
        if (currentMode === "on") {
            localStorage.setItem("dyslexiaMode", "off");
        } else {
            localStorage.setItem("dyslexiaMode", "on");
        }

        // Apply the changes immediately (optional)
        applyDyslexiaFont();
    }

    // Function to apply dyslexia font if needed
    function applyDyslexiaFont() {
        if (localStorage.getItem("dyslexiaMode") === "on") {
            document.body.setAttribute("dyslexia-mode", "on");
        } else {
            document.body.removeAttribute("dyslexia-mode");
        }
    }

    // Call this on page load to apply saved settings
    window.onload = function() {
        applyDyslexiaFont();
    }
    
    </script>
